<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Лола Давлатова — Портфолио</title>

<style>
:root {
    --bg-1: #08090f;
    --bg-2: #111525;
    --bg-3: #17152a;
    --text: #f5f4fa;
    --text-soft: #aaaabd;
    --glass: rgba(255,255,255,.075);
    --glass-border: rgba(255,255,255,.13);
    --accent: #c8a8ff;
    --accent-2: #7dd9ff;
    --menu-bg: rgba(18,20,31,.94);
    --shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);
}

body.light {
    --bg-1: #eeeaf7;
    --bg-2: #f7f5fb;
    --bg-3: #e7e9f5;
    --text: #1d1d2b;
    --text-soft: #656579;
    --glass: rgba(255,255,255,.52);
    --glass-border: rgba(255,255,255,.75);
    --accent: #8060bd;
    --accent-2: #3a9cc5;
    --menu-bg: rgba(247,247,252,.96);
    --shadow:
        0 30px 80px rgba(74,64,110,.17),
        inset 0 1px 0 rgba(255,255,255,.9);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

html {
    background: var(--bg-1);
}

body {
    min-height: 100dvh;
    overflow: hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    color: var(--text);
    background:
        radial-gradient(
            circle at 18% 20%,
            rgba(144,98,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 82% 75%,
            rgba(48,185,230,.12),
            transparent 35%
        ),
        linear-gradient(
            125deg,
            var(--bg-1),
            var(--bg-2),
            var(--bg-3)
        );
    transition:
        background .8s ease,
        color .4s ease;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 45vw;
    height: 45vw;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .16;
    pointer-events: none;
    z-index: 0;
    animation: atmosphere 14s ease-in-out infinite alternate;
}

body::before {
    background: #9a69ff;
    top: -20vw;
    left: -15vw;
}

body::after {
    background: #46c8ef;
    right: -15vw;
    bottom: -25vw;
    animation-delay: -7s;
}

@keyframes atmosphere {
    from {
        transform: translate3d(0,0,0) scale(1);
    }

    to {
        transform: translate3d(60px,40px,0) scale(1.15);
    }
}

/* Светлячки */

.fireflies {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
}

.firefly {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow:
        0 0 5px rgba(255,255,255,.95),
        0 0 12px rgba(180,210,255,.8),
        0 0 20px rgba(170,120,255,.5);
    will-change: transform, opacity;
}

/* Сцена */

.stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow: hidden;
    touch-action: pan-y;
}

/* Страницы */

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    padding:
        40px
        clamp(22px,7vw,100px);

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transform:
        translate3d(0,70px,0)
        scale(.98);

    filter: blur(8px);

    transition:
        opacity .7s cubic-bezier(.22,.61,.36,1),
        transform .8s cubic-bezier(.22,.61,.36,1),
        filter .7s ease,
        visibility 0s linear .8s;
}

.page.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transform:
        translate3d(0,0,0)
        scale(1);

    filter: blur(0);

    transition:
        opacity .7s cubic-bezier(.22,.61,.36,1),
        transform .8s cubic-bezier(.22,.61,.36,1),
        filter .7s ease,
        visibility 0s linear 0s;
}

.page.leaving {
    opacity: 0;
    transform:
        translate3d(0,-60px,0)
        scale(1.01);
    filter: blur(7px);
}

/* Главная */

.profile {
    display: flex;
    align-items: center;
    gap: clamp(30px,5vw,70px);
    width: min(1100px,100%);
}

.photo-frame {
    position: relative;
    width: min(31vw,400px);
    aspect-ratio: 3 / 4;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 22px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
}

.photo-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            transparent 30%,
            transparent 65%,
            rgba(160,220,255,.08)
        );
    pointer-events: none;
}

.photo-frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.profile-info {
    width: min(540px,100%);
}

.eyebrow {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent-2);
}

.profile-name {
    font-size: clamp(38px,5vw,70px);
    line-height: .98;
    letter-spacing: -3px;
    font-weight: 300;
    margin-bottom: 28px;
}

.profile-name strong {
    display: block;
    font-weight: 600;
    background:
        linear-gradient(
            100deg,
            var(--text),
            var(--accent),
            var(--accent-2)
        );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* Информация */

.info-card {
    padding: 20px 24px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.info-row {
    display: grid;
    grid-template-columns: 125px minmax(0,1fr);
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: 14px;
}

.info-row:last-child {
    border-bottom: 0;
}

.info-label {
    color: var(--text-soft);
}

.info-value {
    color: var(--text);
    overflow-wrap: anywhere;
}

/* Вторая страница */

.page-two {
    flex-direction: column;
}

.page-title {
    text-align: center;
    margin-bottom: 38px;
}

.page-title span {
    display: block;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 10px;
}

.page-title h1 {
    font-size: clamp(34px,5vw,65px);
    font-weight: 300;
    letter-spacing: -2px;
}

/* Карточки */

.sections {
    display: grid;
    grid-template-columns:
        repeat(3,minmax(180px,280px));
    gap: 22px;
    width: min(1000px,100%);
}

.section-card {
    position: relative;
    min-height: 240px;
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    border: 1px solid var(--glass-border);
    border-radius: 24px;

    overflow: hidden;
    cursor: pointer;

    color: var(--text);
    text-align: left;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );

    box-shadow: var(--shadow);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1),
        border-color .4s ease,
        box-shadow .4s ease;
}

.section-card::before {
    content: "";
    position: absolute;
    width: 160px;
    height: 160px;
    top: -60px;
    right: -60px;
    border-radius: 50%;
    background: var(--card-color);
    filter: blur(50px);
    opacity: .25;
    transition: .4s ease;
}

.section-card:hover {
    transform: translateY(-10px);
    border-color: rgba(255,255,255,.3);
    box-shadow:
        0 35px 80px rgba(0,0,0,.3),
        0 0 35px var(--card-color);
}

.section-card:hover::before {
    transform: scale(1.4);
    opacity: .4;
}

.section-card:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
}

.card-icon {
    position: absolute;
    top: 26px;
    left: 26px;

    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.11);
}

.card-icon svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: var(--text);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .88;
}

.section-card h2 {
    position: relative;
    z-index: 1;
    font-size: 21px;
    font-weight: 500;
    margin-bottom: 8px;
}

.section-card p {
    position: relative;
    z-index: 1;
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.55;
}

/* Кнопка меню */

.menu-button {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));

    width: 48px;
    height: 48px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;

    border: 1px solid var(--glass-border);
    border-radius: 15px;

    background: var(--glass);
    color: var(--text);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    cursor: pointer;
    z-index: 100;

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

    transition: transform .3s ease;
}

.menu-button:hover {
    transform: scale(1.05);
}

.menu-button span {
    width: 20px;
    height: 2px;
    border-radius: 5px;
    background: var(--text);
}

/* Overlay */

.menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .35s ease,
        visibility 0s linear .35s;

    z-index: 90;
}

.menu-overlay.open {
    opacity: 1;
    visibility: visible;

    transition:
        opacity .35s ease,
        visibility 0s linear 0s;
}

/* Меню */

.side-menu {
    position: fixed;
    top: 0;
    right: 0;

    width: min(350px,88vw);
    height: 100dvh;

    padding:
        max(25px,env(safe-area-inset-top))
        22px
        max(25px,env(safe-area-inset-bottom));

    overflow-y: auto;
    overscroll-behavior: contain;

    background: var(--menu-bg);

    border-left: 1px solid var(--glass-border);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    transform: translateX(105%);

    transition:
        transform .5s cubic-bezier(.77,0,.18,1);

    z-index: 95;

    box-shadow:
        -30px 0 80px rgba(0,0,0,.25);
}

.side-menu.open {
    transform: translateX(0);
}

.menu-profile {
    text-align: center;
    padding: 15px 0 26px;
    border-bottom: 1px solid var(--glass-border);
}

.avatar {
    width: 82px;
    height: 82px;
    margin: 0 auto 14px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.25);
    box-shadow:
        0 0 30px rgba(165,120,255,.22);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.menu-name {
    font-size: 20px;
    font-weight: 500;
}

.menu-subtitle {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 4px;
}

.menu-links {
    padding-top: 18px;
}

.menu-link {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;

    padding: 13px 14px;
    margin-bottom: 5px;

    border: 0;
    border-radius: 14px;

    background: transparent;
    color: var(--text);

    text-decoration: none;
    text-align: left;

    cursor: pointer;
    font-size: 15px;

    transition:
        background .25s ease,
        transform .25s ease;
}

.menu-link:hover {
    background: rgba(255,255,255,.08);
}

.menu-link:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
}

.menu-link .icon {
    width: 30px;
    height: 30px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;
    background: rgba(255,255,255,.07);
}

.menu-link .icon svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: var(--text);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.menu-divider {
    height: 1px;
    background: var(--glass-border);
    margin: 17px 10px;
}

/* Тема */

.theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 14px;
}

.theme-name {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 15px;
}

.theme-icon {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: rgba(255,255,255,.07);
}

.switch {
    position: relative;
    width: 48px;
    height: 27px;
    flex-shrink: 0;
    cursor: pointer;
}

.switch input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.slider {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    background: rgba(255,255,255,.12);
    border: 1px solid var(--glass-border);
    transition: .35s ease;
}

.slider::before {
    content: "";
    position: absolute;
    width: 19px;
    height: 19px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 2px 7px rgba(0,0,0,.25);
    transition: .35s ease;
}

.switch input:checked + .slider {
    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent-2)
        );
}

.switch input:checked + .slider::before {
    transform: translateX(21px);
}

/* Планшеты */

@media (max-width: 850px) {
    .page {
        padding: 70px 25px 30px;
    }

    .profile {
        gap: 30px;
    }

    .photo-frame {
        width: min(34vw,320px);
    }

    .sections {
        gap: 16px;
    }

    .section-card {
        min-height: 220px;
        padding: 26px 22px;
    }
}

/* Телефоны */

@media (max-width: 700px) {
    body {
        overflow: hidden;
    }

    body::before,
    body::after {
        width: 70vw;
        height: 70vw;
        filter: blur(80px);
    }

    .page {
        padding:
            75px 18px
            max(25px,env(safe-area-inset-bottom));

        overflow-y: auto;
        overflow-x: hidden;

        align-items: center;
        justify-content: center;

        -webkit-overflow-scrolling: touch;
    }

    .page-one {
        align-items: flex-start;
    }

    .profile {
        width: 100%;
        max-width: 430px;

        flex-direction: column;
        justify-content: center;

        gap: 22px;

        text-align: center;

        padding: 15px 0;
    }

    .photo-frame {
        width: min(55vw,230px);
        border-radius: 20px;
    }

    .profile-info {
        width: 100%;
    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: 3px;
        margin-bottom: 10px;
    }

    .profile-name {
        font-size: clamp(38px,11vw,52px);
        letter-spacing: -2px;
        margin-bottom: 20px;
    }

    .info-card {
        padding: 15px 17px;
        border-radius: 17px;
        text-align: left;
    }

    .info-row {
        grid-template-columns: 100px minmax(0,1fr);
        gap: 10px;
        padding: 8px 0;
        font-size: 12px;
    }

    .page-two {
        padding-top: 75px;
        padding-bottom: 30px;
    }

    .page-title {
        margin-bottom: 22px;
    }

    .page-title span {
        font-size: 10px;
        letter-spacing: 4px;
        margin-bottom: 7px;
    }

    .page-title h1 {
        font-size: clamp(32px,9vw,45px);
        letter-spacing: -1.5px;
    }

    .sections {
        grid-template-columns: 1fr;
        width: min(430px,100%);
        gap: 12px;
    }

    .section-card {
        min-height: 130px;
        padding: 22px 20px;
        border-radius: 19px;
    }

    .card-icon {
        top: 20px;
        left: 20px;
        width: 40px;
        height: 40px;
        border-radius: 12px;
    }

    .card-icon svg {
        width: 19px;
        height: 19px;
    }

    .section-card h2 {
        font-size: 18px;
        margin-bottom: 5px;
    }

    .section-card p {
        font-size: 12px;
        line-height: 1.45;
        max-width: 280px;
    }

    .menu-button {
        width: 46px;
        height: 46px;
    }
}

/* Маленькие телефоны */

@media (max-width: 380px) {
    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .profile {
        gap: 18px;
    }

    .photo-frame {
        width: 48vw;
    }

    .profile-name {
        font-size: 37px;
    }

    .info-card {
        padding: 12px 14px;
    }

    .info-row {
        grid-template-columns: 88px minmax(0,1fr);
        font-size: 11px;
    }

    .section-card {
        min-height: 120px;
    }
}

/* Уменьшение анимации */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="fireflies" id="fireflies"></div>

<button
    class="menu-button"
    id="menuButton"
    type="button"
    aria-label="Открыть меню"
    aria-expanded="false"
    aria-controls="sideMenu">
    <span></span>
    <span></span>
    <span></span>
</button>

<div class="menu-overlay" id="menuOverlay"></div>

<aside
    class="side-menu"
    id="sideMenu"
    aria-label="Основное меню">

    <div class="menu-profile">
        <div class="avatar">
            <img src="foto.jpg" alt="Лола Давлатова">
        </div>

        <div class="menu-name">Лола Давлатова</div>
        <div class="menu-subtitle">Портфолио</div>
    </div>

    <nav class="menu-links">

        <a class="menu-link" href="experience.html">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <path d="M3 12h18"></path>
                </svg>
            </span>
            <span>Опыт работы</span>
        </a>

        <a class="menu-link" href="volunteering.html">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.8 8.8c0 5.2-8.8 10.2-8.8 10.2S3.2 14 3.2 8.8A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.8Z"></path>
                </svg>
            </span>
            <span>Волонтерство</span>
        </a>

        <a class="menu-link" href="creativity.html">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"></path>
                    <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"></path>
                </svg>
            </span>
            <span>Творчество</span>
        </a>

        <div class="menu-divider"></div>

        <div class="theme-row">
            <div class="theme-name">
                <span class="theme-icon" id="themeIcon">☾</span>
                <span id="themeText">Темная тема</span>
            </div>

            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </div>

    </nav>
</aside>

<main class="stage">

    <section
        class="page page-one active"
        id="pageHome">

        <div class="profile">

            <div class="photo-frame">
                <img
                    src="foto.jpg"
                    alt="Лола Давлатова">
            </div>

            <div class="profile-info">

                <span class="eyebrow">
                    Personal Portfolio
                </span>

                <h1 class="profile-name">
                    Лола
                    <strong>Давлатова</strong>
                </h1>

                <div class="info-card">

                    <div class="info-row">
                        <span class="info-label">Имя</span>

    <section
        class="page page-two"
        id="pageSections">

        <div class="page-title">
            <span>Portfolio</span>
            <h1>Мои направления</h1>
        </div>

        <div class="sections">

            <button
                class="section-card"
                type="button"
                data-section="experience"
                style="--card-color:#a879ff">

                <span class="card-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <path d="M3 12h18"></path>
                    </svg>
                </span>

                <h2>Опыт работы</h2>

                <p>
                    Профессиональный путь,
                    проекты и достижения.
                </p>
            </button>

            <button
                class="section-card"
                type="button"
                data-section="volunteering"
                style="--card-color:#55d5ba">

                <span class="card-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.8 8.8c0 5.2-8.8 10.2-8.8 10.2S3.2 14 3.2 8.8A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.8Z"></path>
                    </svg>
                </span>

                <h2>Волонтерство</h2>

                <p>
                    Общественная деятельность,
                    инициативы и проекты.
                </p>
            </button>

            <button
                class="section-card"
                type="button"
                data-section="creativity"
                style="--card-color:#ff9bc9">

                <span class="card-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"></path>
                        <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"></path>
                    </svg>
                </span>

                <h2>Творчество</h2>

                <p>
                    Идеи, интересы, проекты
                    и творческие работы.
                </p>

</main>

<script>
const pageHome = document.getElementById("pageHome");
const pageSections = document.getElementById("pageSections");

const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const menuOverlay = document.getElementById("menuOverlay");

const themeToggle = document.getElementById("themeToggle");
const themeText = document.getElementById("themeText");
const themeIcon = document.getElementById("themeIcon");

let currentPage = 0;
let isTransitioning = false;
let transitionTimer = null;

const TRANSITION_TIME = 850;

function getPage(index) {
    return index === 0 ? pageHome : pageSections;
}

function goToPage(target) {
    if (
        target === currentPage ||
        target < 0 ||
        target > 1 ||
        isTransitioning
    ) {
        return;
    }

    isTransitioning = true;

    const current = getPage(currentPage);
    const next = getPage(target);

    current.classList.add("leaving");
    next.classList.add("active");

    clearTimeout(transitionTimer);

    transitionTimer = setTimeout(() => {
        current.classList.remove("active", "leaving");
        currentPage = target;
        isTransitioning = false;
    }, TRANSITION_TIME);
}

/* Колесо */

let wheelAccumulator = 0;
let wheelTimer = null;

document.addEventListener(
    "wheel",
    event => {
        if (isTransitioning) return;

        wheelAccumulator += event.deltaY;

        clearTimeout(wheelTimer);

        wheelTimer = setTimeout(() => {
            wheelAccumulator = 0;
        }, 180);

        if (wheelAccumulator > 70) {
            wheelAccumulator = 0;
            goToPage(1);
        }

        if (wheelAccumulator < -70) {
            wheelAccumulator = 0;
            goToPage(0);
        }
    },
    { passive: true }
);

/* Свайп */

let touchStartY = 0;
let touchStartX = 0;
let touchStartTime = 0;

document.addEventListener(
    "touchstart",
    event => {
        if (event.touches.length !== 1) return;

        touchStartY = event.touches[0].clientY;
        touchStartX = event.touches[0].clientX;
        touchStartTime = Date.now();
    },
    { passive: true }
);

document.addEventListener(
    "touchend",
    event => {
        if (isTransitioning) return;

        const touch = event.changedTouches[0];

        const deltaY = touchStartY - touch.clientY;
        const deltaX = touchStartX - touch.clientX;
        const duration = Date.now() - touchStartTime;

        if (duration > 800) return;

        if (Math.abs(deltaY) < 55) return;

        if (Math.abs(deltaY) < Math.abs(deltaX)) return;

        if (deltaY > 0) {
            goToPage(1);
        } else {
            goToPage(0);
        }
    },
    { passive: true }
);

/* Клавиатура */

document.addEventListener("keydown", event => {
    if (
        event.key === "ArrowDown" ||
        event.key === "PageDown"
    ) {
        goToPage(1);
    }

    if (
        event.key === "ArrowUp" ||
        event.key === "PageUp"
    ) {
        goToPage(0);
    }

    if (event.key === "Escape") {
        closeMenu();
    }
});

/* Меню */

function openMenu() {
    sideMenu.classList.add("open");
    menuOverlay.classList.add("open");

    menuButton.setAttribute(
        "aria-expanded",
        "true"
    );

    document.body.style.overflow = "hidden";
}

function closeMenu() {
    sideMenu.classList.remove("open");
    menuOverlay.classList.remove("open");

    menuButton.setAttribute(
        "aria-expanded",
        "false"
    );

    document.body.style.overflow = "";
}

menuButton.addEventListener("click", () => {
    const isOpen =
        sideMenu.classList.contains("open");

    if (isOpen) {
        closeMenu();
    } else {
        openMenu();
    }
});

menuOverlay.addEventListener(
    "click",
    closeMenu
);

/* Тема */

function setTheme(theme) {
    const light = theme === "light";

    document.body.classList.toggle(
        "light",
        light
    );

    themeToggle.checked = light;

    themeText.textContent =
        light
            ? "Светлая тема"
            : "Темная тема";

    themeIcon.textContent =
        light
            ? "☀"
            : "☾";
}

themeToggle.addEventListener(
    "change",
    () => {
        const theme =
            themeToggle.checked
                ? "light"
                : "dark";

        localStorage.setItem(
            "theme",
            theme
        );

        setTheme(theme);
    }
);

const savedTheme =
    localStorage.getItem("theme");

setTheme(savedTheme || "dark");

/* Светлячки */

const fireflyContainer =
    document.getElementById("fireflies");

const fireflies = [];

const isMobile =
    window.matchMedia(
        "(max-width: 700px)"
    ).matches;

const fireflyCount =
    isMobile ? 22 : 42;

const mouse = {
    x: -1000,
    y: -1000,
    active: false
};

for (let i = 0; i < fireflyCount; i++) {
    const element =
        document.createElement("span");

    element.className = "firefly";

    const angle =
        Math.random() *
        Math.PI *
        2;

    const speed =
        0.003 +
        Math.random() *
        0.012;

    const particle = {
        element,

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        vx:
            Math.cos(angle) *
            speed,

        vy:
            Math.sin(angle) *
            speed,

        baseSpeed: speed,

        size:
            1.5 +
            Math.random() *
            2.5,

        phase:
            Math.random() *
            Math.PI *
            2,

        frequency:
            .0005 +
            Math.random() *
            .001,

        drift:
            .012 +
            Math.random() *
            .035,

        opacity:
            .25 +
            Math.random() *
            .65
    };

    element.style.width =
        `${particle.size}px`;

    element.style.height =
        `${particle.size}px`;

    fireflyContainer.appendChild(
        element
    );

    fireflies.push(particle);
}

/* Мышь */

if (!isMobile) {
    window.addEventListener(
        "mousemove",
        event => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
            mouse.active = true;
        },
        { passive: true }
    );

    window.addEventListener(
        "mouseleave",
        () => {
            mouse.active = false;
        }
    );
}

/* Анимация */

let previousTime =
    performance.now();

function animateFireflies(time) {
    const delta =
        Math.min(
            time - previousTime,
            32
        );

    previousTime = time;

    fireflies.forEach(particle => {
        const waveX =
            Math.sin(
                time *
                particle.frequency +
                particle.phase
            ) *
            particle.drift;

        const waveY =
            Math.cos(
                time *
                particle.frequency *
                1.37 +
                particle.phase
            ) *
            particle.drift;

        particle.vx +=
            waveX *
            .003 *
            delta;

        particle.vy +=
            waveY *
            .003 *
            delta;

        const velocity =
            Math.sqrt(
                particle.vx ** 2 +
                particle.vy ** 2
            );

        if (velocity > 0) {
            particle.vx +=
                (
                    particle.vx /
                    velocity *
                    particle.baseSpeed -
                    particle.vx
                ) *
                .004 *
                delta;

            particle.vy +=
                (
                    particle.vy /
                    velocity *
                    particle.baseSpeed -
                    particle.vy
                ) *
                .004 *
                delta;
        }

        if (mouse.active) {
            const dx =
                particle.x - mouse.x;

            const dy =
                particle.y - mouse.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const radius = 150;

            if (
                distance > 0 &&
                distance < radius
            ) {
                const strength =
                    (
                        1 -
                        distance / radius
                    ) ** 2;

                const nx =
                    dx / distance;

                const ny =
                    dy / distance;

                particle.vx +=
                    nx *
                    strength *
                    .008;

                particle.vy +=
                    ny *
                    strength *
                    .008;

                particle.vx +=
                    -ny *
                    strength *
                    .0012;

                particle.vy +=
                    nx *
                    strength *
                    .0012;
            }
        }

        particle.x +=
            particle.vx * delta;

        particle.y +=
            particle.vy * delta;

        const margin = 30;

        if (particle.x < -margin) {
            particle.x =
                window.innerWidth +
                margin;
        }

        if (
            particle.x >
            window.innerWidth +
            margin
        ) {
            particle.x = -margin;
        }

        if (particle.y < -margin) {
            particle.y =
                window.innerHeight +
                margin;
        }

        if (
            particle.y >
            window.innerHeight +
            margin
        ) {
            particle.y = -margin;
        }

        const glow =
            .5 +
            Math.sin(
                time * .002 +
                particle.phase
            ) *
            .5;

        particle.element.style.transform =
            `translate3d(${particle.x}px,${particle.y}px,0)`;

        particle.element.style.opacity =
            particle.opacity *
            (.65 + glow * .35);
    });

    requestAnimationFrame(
        animateFireflies
    );
}

requestAnimationFrame(
    animateFireflies
);

/* Resize */

window.addEventListener(
    "resize",
    () => {
        fireflies.forEach(particle => {
            if (
                particle.x >
                window.innerWidth
            ) {
                particle.x =
                    Math.random() *
                    window.innerWidth;
            }

            if (
                particle.y >
                window.innerHeight
            ) {
                particle.y =
                    Math.random() *
                    window.innerHeight;
            }
        });
    },
    { passive: true }
);

/* Карточки */

document
    .querySelectorAll(".section-card")
    .forEach(card => {
        card.addEventListener(
            "click",
            () => {
                const section =
                    card.dataset.section;

                openPortfolioSection(
                    section
                );
            }
        );
    });

function openPortfolioSection(section) {
    const pages = {
        experience: "experience.html",
        volunteering: "volunteering.html",
        creativity: "creativity.html"
    };

    const target = pages[section];

    if (!target) return;

    window.location.href = target;
}
</script>
